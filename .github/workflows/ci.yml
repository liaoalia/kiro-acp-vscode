name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Test, build and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests (fake ACP agent)
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npx @vscode/vsce package --no-dependencies --out kiro-acp.vsix

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kiro-acp-vsix
          path: kiro-acp.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach VSIX to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kiro-acp-vsix

      - name: Rename with version
        run: mv kiro-acp.vsix "kiro-acp-${GITHUB_REF_NAME#v}.vsix"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: kiro-acp-*.vsix
          generate_release_notes: true
